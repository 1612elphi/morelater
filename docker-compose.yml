services:
  morelater:
    build: .
    user: "1000:1000"
    ports:
      - "3800:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - TZ=Europe/Berlin
    # MORELATER_PASSWORD, MORELATER_KEYS, MORELATER_PUBLIC_URL (the lock)
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
